# Builds Mayoi for macOS, Windows and Linux on every push to main, then
# publishes a prerelease of that build, nightly-<commit>, and removes the
# older ones. Builds are ad hoc signed and carry no update manifests, so
# installed apps never update to a nightly: those follow the Release workflow.
name: Nightly

on:
  push:
    branches: [main]

permissions:
  contents: write # the release, and the uploads to it

# A newer push replaces a build that hasn't finished.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        # Tries again, as the runner's mirrors at times fail to resolve.
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y nsis && exit 0
            sleep 15
          done
          exit 1
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: |
            build/*/*.dmg
            build/*/*.deb
            build/*/*.tar.gz
            build/*/*-setup-*.exe
            build/*/install.*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
      # The repository's releases are immutable, so a tag once used cannot be
      # made again: each build has a tag of its own, and the older ones go
      # only now that every build has succeeded, so that there is always one.
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # install.* is the same file from every build that makes it.
          files="$(find dist -type f | sort)"
          dup="$(awk -F/ '{print $NF}' <<< "$files" | sort | uniq -d)"
          for name in $dup; do
            test "$(find dist -type f -name "$name" -exec sha256sum {} + | cut -d' ' -f1 | sort -u | wc -l)" = 1 \
              || { echo "::error::the builds made different $name"; exit 1; }
          done
          mapfile -t upload < <(awk -F/ '!seen[$NF]++' <<< "$files")
          tag="nightly-${GITHUB_SHA::7}"
          gh release create "$tag" "${upload[@]}" --repo "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Mayoi nightly" \
            --notes "Build of main at ${GITHUB_SHA::7}, not signed for updates."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^nightly-' | grep -vx "$tag" \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
